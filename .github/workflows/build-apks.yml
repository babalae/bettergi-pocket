name: Build arm64 APKs (story + full)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布 GitHub Release（需配置固定签名密钥）'
        type: boolean
        default: false
      release_version:
        description: '发布版本号，如 1.0.1（勾选发布时必填，自动更新代码版本）'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BAIDU_MTJ_APP_KEY: ${{ secrets.BAIDU_MTJ_APP_KEY }}
      BAIDU_MTJ_CHANNEL: github

    steps:
      - name: Checkout Pocket
        uses: actions/checkout@v4

      - name: Prepare release version
        id: version
        if: ${{ inputs.publish_release }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'branch') { throw '自动更新版本需要从分支触发，请选择 main 等分支' }
          $version = ./tools/set-release-version.ps1 -Version ([string]$env:RELEASE_VERSION)
          git ls-remote --exit-code --tags origin "refs/tags/$($version.Tag)" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "发布标签 $($version.Tag) 已存在，请填写新版本号" }
          if ($LASTEXITCODE -ne 2) { throw '无法检查发布标签' }
          "version_name=$($version.VersionName)" >> $env:GITHUB_OUTPUT
          "version_code=$($version.VersionCode)" >> $env:GITHUB_OUTPUT
          "release_tag=$($version.Tag)" >> $env:GITHUB_OUTPUT
          "发布版本：$($version.VersionName)，Android versionCode：$($version.VersionCode)" >> $env:GITHUB_STEP_SUMMARY
          # ls-remote 返回 2 表示标签不存在，此处属于检查通过。
          exit 0

      # 用户指定的 release 分支；仅拉取特产，记录实际提交以便复核。
      - name: Checkout specialty routes
        uses: actions/checkout@v4
        with:
          repository: babalae/bettergi-scripts-list
          ref: release
          path: .ci/routes
          sparse-checkout: repo/pathing/地方特产
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 安装失败' }

      - name: Download and synchronize map assets
        run: |
          ./tools/prepare-ci-pathing-assets.ps1 -RouteDir .ci/routes/repo/pathing
          $routeCommit = git -C .ci/routes rev-parse HEAD
          "特产路线来源：babalae/bettergi-scripts-list release ($routeCommit)" >> $env:GITHUB_STEP_SUMMARY

      - name: Build full release APK
        run: |
          ./gradlew.bat :app:assembleRelease -PincludePathing=true "-PBAIDU_MTJ_APP_KEY=$env:BAIDU_MTJ_APP_KEY" "-PBAIDU_MTJ_CHANNEL=$env:BAIDU_MTJ_CHANNEL" --max-workers=2 --console=plain
          if ($LASTEXITCODE -ne 0) { throw '完整版构建失败' }
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          Copy-Item app/build/outputs/apk/release/app-release-unsigned.apk artifacts/packages/bettergi-pocket-arm64-full.apk
          ./tools/verify-apk.ps1 -ApkPath artifacts/packages/bettergi-pocket-arm64-full.apk -Edition full

      # 单测失败保留日志和报告，但不阻断精简版构建、APK 签名与上传。
      - name: Run unit tests (non-blocking)
        id: unit_tests
        continue-on-error: true
        run: |
          ./gradlew.bat :app:testDebugUnitTest -PincludePathing=true "-PBAIDU_MTJ_APP_KEY=$env:BAIDU_MTJ_APP_KEY" "-PBAIDU_MTJ_CHANNEL=$env:BAIDU_MTJ_CHANNEL" --max-workers=2 --console=plain
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning::单元测试失败，后续 APK 构建、签名和上传将继续；详情见测试报告。'
            '单元测试：失败（不阻断打包），详情见 unit-test-reports 构件。' >> $env:GITHUB_STEP_SUMMARY
            throw '单元测试失败'
          }
          '单元测试：通过。' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload unit test reports
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build story-only release APK
        run: |
          ./gradlew.bat :app:assembleRelease -PincludePathing=false "-PBAIDU_MTJ_APP_KEY=$env:BAIDU_MTJ_APP_KEY" "-PBAIDU_MTJ_CHANNEL=$env:BAIDU_MTJ_CHANNEL" --max-workers=2 --console=plain
          if ($LASTEXITCODE -ne 0) { throw '精简版构建失败' }
          Copy-Item app/build/outputs/apk/release/app-release-unsigned.apk artifacts/packages/bettergi-pocket-arm64-story.apk
          ./tools/verify-apk.ps1 -ApkPath artifacts/packages/bettergi-pocket-arm64-story.apk -Edition lite

      - name: Sign both APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'pocket-signing.jks'
          $signingValues = @($env:ANDROID_KEYSTORE_BASE64, $env:ANDROID_STORE_PASSWORD, $env:ANDROID_KEY_ALIAS, $env:ANDROID_KEY_PASSWORD)
          $present = @($signingValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -gt 0 -and $present -ne 4) { throw '请完整配置四项 Android 签名 Secrets' }
          if ($env:PUBLISH_RELEASE -eq 'true' -and $present -ne 4) { throw '发布 GitHub Release 必须配置四项固定 Android 签名 Secrets' }
          if ($present -eq 4) {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            '签名：仓库配置的发布密钥' >> $env:GITHUB_STEP_SUMMARY
          } else {
            # 无 Secrets 也能得到两个可安装 APK；同一次运行共用此临时测试密钥。
            $env:ANDROID_STORE_PASSWORD = 'android'
            $env:ANDROID_KEY_ALIAS = 'androiddebugkey'
            $env:ANDROID_KEY_PASSWORD = 'android'
            keytool -genkeypair -keystore $keystore -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            if ($LASTEXITCODE -ne 0) { throw '生成临时测试密钥失败' }
            '签名：临时测试密钥（不同运行之间不能直接覆盖安装；发布请配置固定签名 Secrets）' >> $env:GITHUB_STEP_SUMMARY
          }
          $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
          foreach ($apk in Get-ChildItem artifacts/packages/*.apk) {
            & $apksigner sign --ks $keystore --ks-key-alias $env:ANDROID_KEY_ALIAS --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD $apk.FullName
            if ($LASTEXITCODE -ne 0) { throw "APK 签名失败：$($apk.Name)" }
            & $apksigner verify $apk.FullName
            if ($LASTEXITCODE -ne 0) { throw "APK 签名验证失败：$($apk.Name)" }
            $hash = (Get-FileHash -LiteralPath $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "SHA-256：$hash  $($apk.Name)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload signed story-only APK
        uses: actions/upload-artifact@v4
        with:
          name: bettergi-pocket-arm64-story-${{ github.run_number }}
          path: artifacts/packages/bettergi-pocket-arm64-story.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload signed full APK
        uses: actions/upload-artifact@v4
        with:
          name: bettergi-pocket-arm64-full-${{ github.run_number }}
          path: artifacts/packages/bettergi-pocket-arm64-full.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download both signed APKs
        uses: actions/download-artifact@v4
        with:
          pattern: bettergi-pocket-arm64-*-${{ github.run_number }}
          merge-multiple: true
          path: artifacts/packages

      - name: Commit release version to source branch
        id: version_commit
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          $version = ./tools/set-release-version.ps1 -Version $env:RELEASE_VERSION
          if ($version.VersionCode -ne [long]$env:RELEASE_VERSION_CODE) { throw '源码版本与已构建 APK 的版本不一致' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- version.properties
          if ($LASTEXITCODE -ne 0) { throw '暂存版本配置失败' }
          git diff --cached --quiet -- version.properties
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore: release $($version.Tag)"
            if ($LASTEXITCODE -ne 0) { throw '提交版本配置失败' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw '检查版本配置差异失败'
          }
          # 普通快进推送；分支在构建期间已有新提交时停止，避免覆盖其他代码。
          git push origin "HEAD:refs/heads/$env:SOURCE_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw '版本写回失败：请检查分支保护，或基于分支最新代码重新构建' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '读取版本提交失败' }
          "sha=$commit" >> $env:GITHUB_OUTPUT
          "版本已写回分支 $env:SOURCE_BRANCH，提交：$commit" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release with both APKs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.version_commit.outputs.sha }}
          RELEASE_VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = ([string]$env:RELEASE_TAG).Trim()
          if (-not $tag -or -not $env:RELEASE_COMMIT) { throw '缺少发布版本或版本提交' }
          if ($tag.StartsWith('-')) { throw 'Release 标签不能以 - 开头' }
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release 标签格式无效' }
          $apks = @('bettergi-pocket-arm64-story.apk', 'bettergi-pocket-arm64-full.apk') |
            ForEach-Object { (Get-Item -LiteralPath "artifacts/packages/$_" -ErrorAction Stop).FullName }
          $notes = @(
            '本次构建提供两个 arm64-v8a 安装包：',
            '- bettergi-pocket-arm64-story.apk：仅自动剧情，不含地图追踪资源。',
            '- bettergi-pocket-arm64-full.apk：自动剧情 + 地图追踪。',
            '',
            "源码提交：$env:RELEASE_COMMIT",
            "Android versionCode：$env:RELEASE_VERSION_CODE",
            "构建与测试结果：https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            '',
            'SHA-256：'
          )
          foreach ($apk in $apks) {
            $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
            $notes += "$hash  $([IO.Path]::GetFileName($apk))"
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'pocket-release-notes.md'
          [IO.File]::WriteAllLines($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          # 创建新 Release 并附上两个 APK；已有同名 Release 时失败，不覆盖已有附件。
          gh release create $tag @apks --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_COMMIT --title "BetterGI Pocket $tag" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败，请检查标签是否已发布及仓库权限' }
          "GitHub Release：https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
