  <rect x="60" y="251" width="140" height="3" rx="1.5" fill="rgba(255,255,255,.12)"/>
  <rect x="60" y="251" width="47" height="3" rx="1.5" fill="#C9A36A"/>
  <circle cx="228" cy="232" r="15.5" fill="rgba(229,115,95,.16)" stroke="rgba(229,115,95,.6)"/>
  <rect x="223" y="227" width="10" height="10" rx="1.5" fill="#E5735F"/>

  <!-- 启动分组 -->
  <rect x="16" y="268" width="240" height="44" rx="10" fill="rgba(255,255,255,.07)"/>
  <use href="#open" x="28" y="280" width="20" height="20" fill="rgba(247,240,228,.7)"/>
