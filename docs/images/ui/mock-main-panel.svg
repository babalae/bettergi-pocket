  <rect width="800" height="360" fill="url(#sky)"/>
  <g fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.6)" stroke-width="1.5">
    <circle cx="62" cy="58" r="44"/>
    <circle cx="132" cy="24" r="12"/><circle cx="166" cy="24" r="12"/><circle cx="200" cy="24" r="12"/>
    <circle cx="560" cy="22" r="13"/><circle cx="596" cy="22" r="13"/><circle cx="632" cy="22" r="13"/>
    <circle cx="668" cy="22" r="13"/><circle cx="704" cy="22" r="13"/><circle cx="740" cy="22" r="13"/><circle cx="776" cy="22" r="13"/>
    <rect x="690" y="96" width="96" height="28" rx="14"/><rect x="690" y="134" width="96" height="28" rx="14"/><rect x="690" y="172" width="96" height="28" rx="14"/>
    <circle cx="110" cy="290" r="44"/>
    <circle cx="722" cy="292" r="34"/><circle cx="648" cy="320" r="22"/><circle cx="690" cy="226" r="20"/><circle cx="596" cy="332" r="16"/>
  </g>
  <rect x="300" y="344" width="200" height="5" rx="2.5" fill="#6fd17a"/>
