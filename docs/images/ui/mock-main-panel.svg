  <rect x="118.5" y="278.5" width="52" height="23" rx="6" fill="none" stroke="rgba(247,240,228,.25)"/>
  <use href="#renew" x="124" y="283" width="14" height="14" fill="rgba(247,240,228,.7)"/>
  <text x="142" y="294" class="l mu">自动</text>
  <rect x="196.5" y="278.5" width="47" height="23" rx="8" fill="rgba(201,163,106,.15)" stroke="rgba(201,163,106,.6)"/>
  <text x="220" y="294" class="l gold" text-anchor="middle">启动</text>

  <!-- 页脚 -->
  <g transform="translate(26,322)" fill="none" stroke="#FB7299" stroke-width="1.8" stroke-linecap="round">
    <rect x="0" y="4" width="18" height="13" rx="3"/><path d="M5 1l3 3M13 1l-3 3"/>
  </g>
  <circle cx="32" cy="332.5" r="1.2" fill="#FB7299"/><circle cx="38" cy="332.5" r="1.2" fill="#FB7299"/>
  <text x="52" y="336" class="c">v1.0</text>
  <use href="#power" x="204" y="325" width="14" height="14" fill="rgba(247,240,228,.7)"/>
  <text x="222" y="336" class="l mu">退出</text>
</svg>
