  <rect x="118.5" y="162.5" width="80" height="23" rx="6" fill="rgba(201,163,106,.18)" stroke="rgba(201,163,106,.55)"/>
  <use href="#ffwd" x="124" y="167" width="14" height="14" fill="#C9A36A"/>
  <text x="142" y="178" class="l gold">快速跳过</text>
  <rect x="208" y="164" width="36" height="20" rx="10" fill="#C9A36A"/><circle cx="234" cy="174" r="7.5" fill="#1C1612"/>

  <!-- 地图追踪分组：执行中 -->
  <rect x="16" y="204" width="240" height="56" rx="10" fill="rgba(255,255,255,.07)"/>
  <use href="#map" x="28" y="214" width="20" height="20" fill="rgba(247,240,228,.7)"/>
