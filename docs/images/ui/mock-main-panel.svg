  <!-- 状态条：标题行可触摸，正文不可触摸 -->
  <rect x="290" y="44" width="320" height="118" rx="8" fill="rgba(28,22,18,.92)" stroke="rgba(201,163,106,.35)"/>
  <rect x="290" y="72" width="320" height="1" fill="rgba(255,255,255,.08)"/>
  <circle cx="302" cy="58" r="4" fill="#C9A36A"/>
  <text x="312" y="62" class="l gold">3/9</text>
  <text x="338" y="62" class="mt" style="font-size:12px">01-海灵芝-绀田村左上…</text>
  <text x="526" y="62" class="c" text-anchor="end">02:15</text>
  <rect x="533" y="47" width="22" height="22" rx="6" fill="rgba(229,115,95,.18)"/>
  <rect x="539" y="53" width="10" height="10" rx="1.5" fill="#E5735F"/>
  <use href="#less" x="561" y="49" width="18" height="18" fill="rgba(247,240,228,.7)"/>
  <use href="#close" x="586" y="49" width="18" height="18" fill="rgba(247,240,228,.7)"/>
  <text x="300" y="89" class="m">02:14:51<tspan class="mt" dx="8">开始路线 01-海灵芝-绀田村左上角-5个</tspan></text>
  <text x="300" y="105" class="m">02:14:51<tspan class="mt" dx="8">小地图匹配：SIFT</tspan></text>
  <text x="300" y="121" class="m">02:14:53<tspan class="mt" dx="8">传送至传送锚点 (7156.7, 9313.96)</tspan></text>
  <text x="300" y="137" class="m">02:14:58<tspan class="mt warn" dx="8">未识别到小地图，重试 1/3</tspan></text>
  <text x="300" y="153" class="m">02:15:02<tspan class="mt" dx="8">已到达路径点 3/12</tspan></text>

  <!-- 主面板 -->
  <rect x="8" y="64" width="256" height="288" rx="14" fill="rgba(28,22,18,.96)" stroke="rgba(201,163,106,.4)"/>
  <circle cx="28" cy="84" r="12" fill="#F4E6C8"/><circle cx="28" cy="84" r="7" fill="#C9A36A"/>
  <text x="48" y="89" class="h">更好的原神</text>
  <rect x="128" y="75" width="62" height="18" rx="9" fill="rgba(201,163,106,.2)"/>
  <circle cx="137" cy="84" r="3" fill="#C9A36A"/>
  <text x="144" y="88" class="c gold" style="font-weight:600">路线 3/9</text>
  <use href="#article" x="202" y="74" width="20" height="20" fill="#C9A36A"/>
  <use href="#close" x="234" y="74" width="20" height="20" fill="rgba(247,240,228,.7)"/>

  <!-- 实时任务分组 -->
  <rect x="16" y="108" width="240" height="88" rx="10" fill="rgba(255,255,255,.07)"/>
