  <path d="M253 93h59v26h-59a8 8 0 0 1-8-8v-10a8 8 0 0 1 8-8z" fill="rgba(201,163,106,.22)"/>
  <rect x="312.5" y="93" width="1" height="26" fill="rgba(201,163,106,.45)"/>
  <text x="279" y="110.5" class="l gold" text-anchor="middle">模板匹配</text>
  <text x="346" y="110.5" class="l mu" text-anchor="middle">SIFT</text>
  <rect x="44" y="132" width="348" height="1" fill="rgba(255,255,255,.07)"/>

