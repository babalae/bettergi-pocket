  <rect x="228.5" y="140.5" width="103" height="27" rx="8" fill="none" stroke="rgba(247,240,228,.18)"/>
  <use href="#minus" x="236" y="146" width="16" height="16" fill="#F7F0E4"/>
  <text x="280" y="158.5" class="l" text-anchor="middle">1.0 s</text>
  <use href="#plus" x="308" y="146" width="16" height="16" fill="#F7F0E4"/>
  <rect x="344" y="144" width="36" height="20" rx="10" fill="#C9A36A"/><circle cx="370" cy="154" r="7.5" fill="#1C1612"/>
  <rect x="44" y="176" width="348" height="1" fill="rgba(255,255,255,.07)"/>

  <text x="44" y="198" class="b">续盾间隔</text>
  <text x="44" y="215" class="c">自动 = 按角色战技冷却</text>
  <rect x="276.5" y="188.5" width="103" height="27" rx="8" fill="none" stroke="rgba(247,240,228,.18)"/>
  <use href="#minus" x="284" y="194" width="16" height="16" fill="rgba(247,240,228,.3)"/>
  <text x="328" y="206.5" class="l" text-anchor="middle">自动</text>
  <use href="#plus" x="356" y="194" width="16" height="16" fill="#F7F0E4"/>

  <!-- 右栏：队伍角色 -->
