  <use href="#air" x="420" y="284" width="16" height="16" fill="#5CD6B0"/>
  <text x="444" y="297" class="b">风</text><text x="464" y="297" class="c">3 人</text>
  <use href="#chev" x="566" y="285" width="14" height="14" fill="rgba(247,240,228,.5)"/>
  <use href="#fire" x="600" y="284" width="16" height="16" fill="rgba(232,100,76,.45)"/>
  <text x="624" y="297" class="b dis">火</text><text x="644" y="297" class="c dis">已关闭</text>
  <use href="#chev" x="746" y="285" width="14" height="14" fill="rgba(247,240,228,.5)"/>
