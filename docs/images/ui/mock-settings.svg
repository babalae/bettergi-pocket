  <text x="524" y="145" class="b">绮良良、莱依拉、茜特菈莉…</text>
  <text x="740" y="144" class="l mu" text-anchor="end">5</text>
  <use href="#chev" x="744" y="132" width="16" height="16" fill="rgba(247,240,228,.5)"/>
  <rect x="446" y="160" width="322" height="1" fill="rgba(255,255,255,.07)"/>

  <use href="#shield" x="420" y="171" width="18" height="18" fill="rgba(247,240,228,.7)"/>
  <text x="446" y="185" class="b mu">生存位·长E</text>
  <text x="524" y="185" class="b">钟离</text>
  <text x="740" y="184" class="l mu" text-anchor="end">1</text>
  <use href="#chev" x="744" y="172" width="16" height="16" fill="rgba(247,240,228,.5)"/>

  <text x="412" y="224" class="sec">元素采集<tspan class="c" style="font-weight:400" dx="6">路线包含对应采集动作时才使用</tspan></text>
